name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: python3 tests/test_suggest.py

  plugin-manifest:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate plugin and marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code@latest plugin validate .claude-plugin/plugin.json --strict
          npx -y @anthropic-ai/claude-code@latest plugin validate .claude-plugin/marketplace.json --strict
